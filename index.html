<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyGlot Master - Lộ Trình Giao Tiếp AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col" id="body-theme">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">PolyGlot Master</h1>
                    <p class="text-[11px] text-slate-500 font-medium">Học ngoại ngữ giao tiếp chuẩn AI</p>
                </div>
            </div>

            <!-- CHỌN NGÔN NGỮ & CẤP ĐỘ -->
            <div class="flex items-center gap-2 flex-wrap w-full sm:w-auto justify-start sm:justify-end">
                <select id="lang-select" onchange="changeLanguage()" class="bg-slate-100 border border-slate-300 text-slate-700 text-xs rounded-lg px-2 py-1.5 font-semibold outline-none">
                    <option value="en">🇬🇧 Tiếng Anh</option>
                    <option value="zh">🇨🇳 Tiếng Trung</option>
                    <option value="fr">🇫🇷 Tiếng Pháp</option>
                    <option value="ko">🇰🇷 Tiếng Hàn</option>
                    <option value="es">🇪🇸 Tiếng TBN</option>
                    <option value="ja">🇯🇵 Tiếng Nhật</option>
                </select>

                <select id="level-select" onchange="changeLevel()" class="bg-slate-100 border border-slate-300 text-slate-700 text-xs rounded-lg px-2 py-1.5 font-semibold outline-none"></select>

                <select id="theme-select" onchange="changeTheme()" class="bg-slate-100 border border-slate-300 text-slate-700 text-xs rounded-lg px-2 py-1.5 font-semibold outline-none">
                    <option value="vibrant">🎨 Sáng</option>
                    <option value="dark">🌙 Tối</option>
                </select>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-4 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-4">

        <!-- SIDEBAR / MENU CHỦ ĐỀ -->
        <aside class="lg:col-span-1 space-y-3">
            <div class="bg-white p-1 rounded-xl border border-slate-200 shadow-sm flex">
                <button onclick="switchTab(1)" id="tab-btn-1" class="flex-1 py-2 text-xs font-bold rounded-lg bg-indigo-600 text-white transition shadow-sm">
                    <i class="fa-solid fa-brain mr-1"></i> Lộ Trình AI
                </button>
                <button onclick="switchTab(2)" id="tab-btn-2" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 hover:bg-slate-100 transition">
                    <i class="fa-solid fa-layer-group mr-1"></i> Tiện Ích
                </button>
            </div>

            <!-- TAB 1 CHỦ ĐỀ -->
            <div id="sidebar-tab-1" class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 px-1">Chủ đề bài học</h3>
                <div id="topics-list" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-1 gap-1.5"></div>
            </div>

            <!-- TAB 2 BỔ SUNG -->
            <div id="sidebar-tab-2" class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2 hidden">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 px-1">Tiện ích & Mở rộng</h3>
                <button onclick="loadSection('custom-lessons')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition flex items-center justify-between">
                    <span><i class="fa-solid fa-pen-nib mr-2 text-indigo-500"></i> Bài học tự tạo</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
                <button onclick="loadSection('podcasts')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition flex items-center justify-between">
                    <span><i class="fa-solid fa-podcast mr-2 text-violet-500"></i> Podcasts Hub</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
                <button onclick="loadSection('irregular-verbs')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition flex items-center justify-between">
                    <span><i class="fa-solid fa-book-bookmark mr-2 text-rose-500"></i> Động Từ Bất Quy Tắc</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
                <button onclick="loadSection('api-config')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 transition flex items-center justify-between">
                    <span><i class="fa-solid fa-key mr-2"></i> Cấu hình API Keys</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <section class="lg:col-span-3 space-y-4">
            
            <!-- THANH ĐIỀU CHỈNH ÂM THANH -->
            <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-700"><i class="fa-solid fa-sliders text-indigo-600 mr-1"></i> Tốc độ:</span>
                    <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="0.9" oninput="document.getElementById('speed-val').innerText = this.value + 'x'" class="accent-indigo-600 cursor-pointer w-24">
                    <span id="speed-val" class="text-xs font-bold text-indigo-600 w-8">0.9x</span>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="playElevenLabsTTS(currentActiveText)" class="bg-violet-600 hover:bg-violet-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Đọc AI
                    </button>
                    <button onclick="speakText(currentActiveText)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1">
                        <i class="fa-solid fa-volume-high"></i> Đọc Thường
                    </button>
                </div>
            </div>

            <!-- MAIN LESSON VIEW CONTAINER -->
            <div id="main-content-display" class="space-y-4"></div>

        </section>
    </main>
